<section id="contacto">

	<h2>Contáctanos</h2>

	<form>
		Nombre y apellido:
		<input type="text" id="nombre" name="nombre"><br>

		Correo electrónico:
		<input type="email" id="correo" name="correo"><br>

		Escribe tu consulta:
		<br>
		<textarea id="mensaje" name="mensaje" rows="5"></textarea><br>

		<button type="submit">Enviar</button>
		<button type="reset">Limpiar</button><br>
	</form>

	<p>También puedes realizar tus consultas por WhatsApp.</p>
